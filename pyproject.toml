[project]
name = "bitemporal-ledger"
version = "0.1.0"
description = "Bitemporal portfolio accounting and performance engine (educational prototype)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "psycopg[binary]>=3.2,<3.4",
    "pydantic>=2.9,<3",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10",
    "pytest-cov>=5.0",
    "ruff>=0.6,<0.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
