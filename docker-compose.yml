services:
  postgres:
    image: postgres:16
    container_name: bitemporal-ledger-pg
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in local .env}
      POSTGRES_DB: ${POSTGRES_DB:-bitemporal_ledger}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - bitemporal_ledger_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-bitemporal_ledger}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  bitemporal_ledger_pgdata:

