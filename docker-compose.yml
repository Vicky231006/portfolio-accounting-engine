services:
  postgres:
    image: postgres:16
    container_name: bitemporal-ledger-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bitemporal_ledger
    ports:
      - "5434:5432"
    volumes:
      - bitemporal_ledger_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bitemporal_ledger"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  bitemporal_ledger_pgdata:
